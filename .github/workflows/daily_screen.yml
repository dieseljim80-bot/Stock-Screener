name: Daily Stock Screener

on:
  schedule:
    # Runs 9:30pm UTC = 4:30pm ET (~30 min after US market close), weekdays.
    # Change to e.g. "30 21 * * 1" for once-a-week (Mondays) instead.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          # Optional — only needed if you also want email alerts.
          # Omit these secrets entirely to skip email and just publish results.json.
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          # Yahoo sometimes throttles the free data for a while. The script
          # refuses to publish incomplete data (it exits with an error), so
          # retry a couple of times, waiting in between, before giving up.
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if python stock_screener.py --min-score 3 --output results.json --history-file history.json; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Run failed (likely Yahoo throttling). Waiting 20 minutes before retrying..."
              sleep 1200
            fi
          done
          echo "All attempts failed - keeping the previous results."
          exit 1

      - name: Stage results.json for publishing
        run: |
          mkdir -p public
          cp results.json public/results.json

      - name: Publish results.json to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false

      - name: Commit updated history.json back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update ticker history [skip ci]"
            git push
          fi

