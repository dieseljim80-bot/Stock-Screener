name: Daily Stock Screener

on:
  schedule:
    # Runs 9:30pm UTC = 4:30pm ET (~30 min after US market close), weekdays.
    # Change to e.g. "30 21 * * 1" for once-a-week (Mondays) instead.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          # Optional — only needed if you also want email alerts.
          # Omit these secrets entirely to skip email and just publish results.json.
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python stock_screener.py --min-score 3 --output results.json

      - name: Stage results.json for publishing
        run: |
          mkdir -p public
          cp results.json public/results.json

      - name: Publish results.json to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false

